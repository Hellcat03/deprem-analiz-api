services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_PAROLA:?SQL_PAROLA gerekli}
    volumes: [veri:/var/opt/mssql]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b"]
      interval: 5s
      timeout: 5s
      retries: 40
  goc:
    build: .
    command: ["--goc"]
    environment:
      ConnectionStrings__Deprem: "Server=sql;Database=DepremAkademik;User ID=sa;Password=${SQL_PAROLA};Encrypt=true;TrustServerCertificate=true"
    depends_on:
      sql:
        condition: service_healthy
  api:
    build: .
    ports: ["127.0.0.1:5196:8080"]
    environment:
      ConnectionStrings__Deprem: "Server=sql;Database=DepremAkademik;User ID=sa;Password=${SQL_PAROLA};Encrypt=true;TrustServerCertificate=true"
      YonetimAnahtari: ${YONETIM_ANAHTARI:?YONETIM_ANAHTARI gerekli}
      IzinliKokenler__0: ${FRONTEND_KOKENI:-http://localhost:5173}
    depends_on:
      goc:
        condition: service_completed_successfully
volumes:
  veri:

